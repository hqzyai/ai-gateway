model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: bedrock-claude-sonnet-3.5
    litellm_params:
      model: "bedrock/us.anthropic.claude-3-5-sonnet-20240620-v1:0"
      aws_region_name: "us-east-1"

  - model_name: bedrock-claude-sonnet-4
    litellm_params:
      model: "bedrock/us.anthropic.claude-sonnet-4-20250514-v1:0"
      aws_region_name: "us-east-1"

  - model_name: bedrock-claude-sonnet-4.5
    litellm_params:
      model: "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      aws_region_name: "us-east-1"

  - model_name: bedrock-claude-opus-4.5
    litellm_params:
      model: "bedrock/converse/us.anthropic.claude-opus-4-5-20251101-v1:0"
      aws_region_name: "us-east-1"

  - model_name: bedrock-nova-premier
    litellm_params:
      model: "bedrock/us.amazon.nova-premier-v1:0"
      aws_region_name: "us-east-1"

# MCP Server Configuration
mcp_servers:
  # Wikipedia MCP - reliable and works without external deps
  wikipedia:
    transport: "stdio"
    command: "uvx"
    args: ["mcp-server-fetch"]
    description: "Fetch web pages and Wikipedia content"
  deepwiki:
    transport: "http"
    url: "https://mcp.deepwiki.com/mcp"


# General Settings
general_settings:
  master_key: sk-1234
  store_model_in_db: false

# LiteLLM Settings
litellm_settings:
  # callbacks: [ "headroom_interception" ]  # 关掉了，避免和下面 guardrails 里的 headroom-compression 重复压缩；要开回来把这行取消注释即可
  headroom_interception_params:
    api_base: http://127.0.0.1:8787
    api_key: null                      # 本地 headroom proxy 默认 loopback-only，不需要 token
    model: null                        # 可选，不填就用请求本身的 model
    unreachable_fallback: fail_closed  # 或 fail_open（Headroom 服务不可用时降级为不压缩，仍正常转发）
    tool_call_format: openai           # 或 hermes（见下）
  # Enable MCP Semantic Tool Filter
  mcp_semantic_tool_filter:
    enabled: true
    embedding_model: "text-embedding-3-small"
    top_k: 5
    similarity_threshold: 0.3

# Headroom guardrail path (for comparing against headroom_interception above).
# default_on is intentionally false: headroom_interception already compresses
# every request globally, so leaving this default_on:true would double-compress
# every request (guardrail pre_call runs earlier in the lifecycle than
# headroom_interception's pre_call_deployment_hook). Opt a specific test
# request into this path with:
#   curl ... -d '{"model": "gpt-4o", "guardrails": ["headroom-compression"], "messages": [...]}'
# to see it show up in the Guardrails & Policy Compliance panel in the logs UI.
guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: http://127.0.0.1:8787
      default_on: true
      unreachable_fallback: fail_closed
      tool_call_format: openai

